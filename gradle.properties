# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1,1.22)
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.251
# Het bereik van NeoForge-versies waarmee de mod werkt: vanaf de versie waarmee we bouwen en testen.
# Met een oudere NeoForge krijgt een speler bij het opstarten een duidelijke melding in plaats van een crash.
neo_version_range=[21.1.251,)
# De versie van de modloader (FML) die 1.21.1 gebruikt.
loader_version_range=[4,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=imttech
# The human-readable display name for the mod.
mod_name=I.M.T Technology
# Wie de mod maakte (staat in de modlijst van Minecraft).
mod_authors=tunnelsensor
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
# Jouw keuze (11 november; van 17 oktober tot dan was het MIT): All Rights Reserved. De volledige tekst staat in
# LICENSE en gaat mee in de jar.
mod_license=All Rights Reserved
# De versie van de mod (zie https://semver.org/). Hier staan alleen de eerste twee getallen; het derde
# telt de build zelf: het aantal commits sinds deze regel voor het laatst veranderde (zie build.gradle).
# Elke commit geeft dus vanzelf een hogere versie: 1.2.0, 1.2.1, 1.2.2, ...
# - Een GROTE UPDATE (als jij het zo noemt)? Verhoog het eerste getal en zet het tweede op 0
#   (1.2 -> 2.0, dan is het 2.0.0).
# - Iets NIEUWS (een nieuw blok, item, systeem of nieuwe functie, zoals de Electric Furnace)? Verhoog het
#   tweede getal in dezelfde commit (1.2 -> 1.3, dan begint het weer bij 1.3.0).
# - Een fix of klein ding (tekst weg, bug opgelost)? Niets doen, het derde getal telt vanzelf (2.0.1, ...).
mod_version=2.11
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.senne.imttech
